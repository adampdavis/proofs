name = "arginf"
defaultTargets = ["Theorems"]

# Build on accepted libraries instead of redoing their work: cslib-frontier brings CSLib and
# Mathlib with it. Pinned to an exact commit; bump deliberately (statement hashes do not change).
[[require]]
name = "cslib-frontier"
git = "https://github.com/cslib-community/cslib-frontier"
rev = "af39436f4a74e9ad6ec356b41a4b812ddfe26cee"

[[lean_lib]]
name = "Theorems"
globs = ["Theorems.+"]
