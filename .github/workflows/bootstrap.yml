# Manual: resolve lake-manifest.json for the pinned Mathlib and upload it as an artifact.
name: bootstrap manifest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - uses: actions/upload-artifact@v4
        with:
          name: lake-manifest
          path: lake-manifest.json
