# On every merge: rebuild everything, audit every proof, then ask arginf.com to re-render.
name: main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
      - name: Restore dependency cache
        id: depcache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch dependencies and restore build caches
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          lake exe cache get || true
          # cslib-frontier publishes build outputs for every main commit; fall back to building.
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      - name: Build
        run: lake build
      - name: Save dependency cache for PR checks
        if: steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - run: python3 tools/arginf.py audit
      - run: python3 tools/arginf.py index > index.json
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: index.json
  publish-index:
    # arginf.com reads index.json from the `index` branch. Runs only after a verified main build.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: index
      - name: Publish to the index branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 -c "import json; json.load(open('index.json'))"
          git init -q -b index site && mv index.json site/ && cd site
          git config user.name "arginf-bot" && git config user.email "actions@users.noreply.github.com"
          git add index.json && git commit -qm "index for $SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" index
