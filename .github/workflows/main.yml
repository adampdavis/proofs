# On every merge: rebuild everything, audit every proof, then ask arginf.com to re-render.
name: main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
      - name: Fetch dependencies and restore build caches
        run: |
          lake exe cache get || true
          # cslib-frontier publishes build outputs for every main commit; fall back to building.
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      - name: Build
        run: lake build
      - run: python3 tools/arginf.py audit
      - run: python3 tools/arginf.py index > index.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild arginf.com
        env:
          WEBHOOK: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$WEBHOOK" >/dev/null; else echo "no webhook configured"; fi
